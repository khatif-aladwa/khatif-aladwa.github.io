<style>
/* Layout: right-side menu + working area; RTL; light ground with gold accents from the Khatif Aladwa brand */
:root{
  --bg:#F7F6F2;--surface:#FFFFFF;--line:#E6E3DA;--line2:#F0EEE7;--fg:#1C1B18;--muted:#6B675E;
  --gold:#E8C64A;--on-gold:#1C1B18;--gold-ink:#7A5C00;--gold-soft:#FBF3D5;
  --ok:#1F6B2A;--ok-bg:#E5F4E4;--bad:#A12B2B;--bad-bg:#FBEBEB;--warn:#7A4E00;--warn-bg:#FBF0D9;
  --overlay:rgba(28,27,24,.45);
  --font:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151412;--surface:#1E1D1A;--line:#34322C;--line2:#2A2924;--fg:#EDEAE2;--muted:#A8A396;
  --gold:#E8C64A;--on-gold:#1C1B18;--gold-ink:#E8C64A;--gold-soft:#3A3220;
  --ok:#8ED39A;--ok-bg:#1F3324;--bad:#F0A0A0;--bad-bg:#3A1F1F;--warn:#EBC27A;--warn-bg:#3A2E18;
  --overlay:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151412;--surface:#1E1D1A;--line:#34322C;--line2:#2A2924;--fg:#EDEAE2;--muted:#A8A396;
  --gold:#E8C64A;--on-gold:#1C1B18;--gold-ink:#E8C64A;--gold-soft:#3A3220;
  --ok:#8ED39A;--ok-bg:#1F3324;--bad:#F0A0A0;--bad-bg:#3A1F1F;--warn:#EBC27A;--warn-bg:#3A2E18;
  --overlay:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
a{color:var(--gold-ink)}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.shell{display:flex;flex-wrap:wrap;min-height:100%;direction:rtl}
.side{flex:1 1 230px;background:var(--surface);border-left:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:2px}
.brand{padding:4px 12px 16px}
.brand b{display:block;font-size:20px;font-weight:800}
.brand span{font-size:13px;color:var(--muted)}
.nl{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:10px;color:var(--fg);text-decoration:none;font-size:15px;min-height:44px}
.nl:hover{background:var(--bg)}
.nl.on{background:var(--gold-soft);color:var(--gold-ink);font-weight:700}
.nl.soon{color:var(--muted)}
.nl small{font-size:11px;background:var(--line2);color:var(--muted);border-radius:999px;padding:1px 8px}
.nl small.badge{background:var(--gold);color:var(--on-gold);font-weight:800;font-size:12px}
.me{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.me b{font-size:14px}.me span{font-size:13px;color:var(--muted)}
.main{flex:999 1 560px;min-width:0;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){.main{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.head h1{font-size:25px;font-weight:800}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi p{margin:0;color:var(--muted);font-size:14px}
.kpi b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--gold);color:var(--on-gold);font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.04)}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.sec:hover{background:var(--bg)}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--gold-ink);cursor:pointer;padding:6px 4px;font-weight:700;min-height:36px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);width:100%;font-size:15px}
textarea{padding:10px 12px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:#B8901A;flex:none}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.name{font-weight:700;white-space:normal;min-width:160px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-mute{background:var(--line2);color:var(--muted)}
.low{color:var(--bad);font-weight:800}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.pick-res{display:flex;flex-direction:column;gap:4px;margin-top:6px}.pick-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;text-align:right;min-height:44px}.pick-item:hover{border-color:var(--gold-ink)}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--line2)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.note{font-size:13px;color:var(--muted);margin:0}
.banner{background:var(--gold-soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px}
/* modal */
.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:20}
.dlg{background:var(--surface);border-radius:16px;width:100%;max-width:640px;padding:22px;display:flex;flex-direction:column;gap:16px;direction:rtl;margin-block:auto}
.dlg.wide{max-width:920px}
.dlg h2{font-size:20px;font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pgroup{display:flex;flex-direction:column}
.pgroup h3{font-size:14px;color:var(--muted);margin:10px 0 2px}
.prow{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.prow label{flex:1;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:180px}
.prow select{width:auto;min-width:140px;min-height:38px;font-size:14px}
.err{color:var(--bad);font-size:14px;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.18);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;z-index:30}
.login{max-width:520px;margin:6vh auto;padding-inline:16px;display:flex;flex-direction:column;gap:18px;direction:rtl}
.ulist{display:flex;flex-direction:column;gap:8px}
.ubtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:right;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;min-height:56px}
.ubtn:hover{border-color:var(--gold)}
.ubtn span{color:var(--muted);font-size:13px}
/* top bar, bell, drawer */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:-4px}
.tb-start{display:flex;align-items:center;gap:8px;min-width:0}
.tb-brand{display:none;font-weight:800;font-size:18px}
.tb-end{display:flex;align-items:center;gap:8px;position:relative}
.icbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;flex:none}
.icbtn:hover{background:var(--bg)}
.icbtn svg{width:22px;height:22px}
.icbtn .dot{position:absolute;top:-6px;left:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#C62828;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
.tb-user{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.npanel{position:absolute;top:52px;left:0;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);z-index:25;direction:rtl}
.npanel h3{font-size:16px;padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.nitem{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line2);color:var(--fg);text-decoration:none;font-size:14px}
.nitem:hover{background:var(--bg)}
.nitem .tag{flex:none}
.menu-btn{display:none}
.side-ov{display:none}
/* password eye, search clear, field errors */
.fx{position:relative;display:block}
.fx input{padding-left:46px}
.fx .fxb{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}
.fx .fxb:hover{color:var(--fg);background:var(--line2)}
.fx .fxb svg{width:20px;height:20px}
.fx .fxb[hidden]{display:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.bad-f,input.bad-f,select.bad-f,textarea.bad-f{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-bg)}
.ferr{color:var(--bad);font-size:13px;font-weight:700;margin:4px 0 0}
.fhint{color:var(--warn);font-size:12.5px;font-weight:700;margin:3px 0 0}
.progress{height:10px;border-radius:6px;background:var(--line2);overflow:hidden}.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
@media (min-width:900px){.shell{flex-wrap:nowrap}.side{flex:0 0 250px;position:sticky;top:0;height:100vh;overflow-y:auto}.main{flex:1 1 auto}}
/* phones */
@media (max-width:899px){
  .shell{display:block}
  .side{position:fixed;top:0;bottom:0;right:0;width:min(300px,86vw);z-index:40;transform:translateX(105%);transition:transform .22s ease;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding-top:max(20px,env(safe-area-inset-top,0px))}
  .shell.nav-open .side{transform:none}
  .shell.nav-open .side-ov{display:block;position:fixed;inset:0;background:var(--overlay);z-index:35}
  .menu-btn{display:inline-flex}
  .tb-brand{display:block}
  .tb-user{display:none}
  .topbar{position:sticky;top:0;z-index:15;background:var(--bg);padding:10px 0;margin:-14px 0 -6px}
  .main{padding-top:14px;gap:14px}
  .head h1{font-size:22px}
  .head > .row, .head > .btn, .head > a.btn{width:100%}
  .head > .row .btn{flex:1 1 auto}
  .card{padding:14px;border-radius:12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi b{font-size:24px}
  [role=tablist]{overflow-x:auto;flex-wrap:nowrap!important;max-width:100%;align-self:stretch!important}
  [role=tablist] .btn{flex:none}
  /* tables become cards */
  .tw table.cards thead{display:none}
  .tw table.cards, .tw table.cards tbody{display:block}
  .tw table.cards tr{display:block;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 4px;background:var(--surface)}
  .tw table.cards td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line2);white-space:normal;text-align:left;min-height:36px}
  .tw table.cards td:last-child{border-bottom:0}
  .tw table.cards td::before{content:attr(data-label);color:var(--muted);font-size:13px;font-weight:500;text-align:right;flex:none;max-width:45%}
  .tw table.cards td.name{min-width:0;font-size:15px}
  .tw table.cards td[data-label=""]::before{display:none}
  .tw table.cards td[data-label=""]{justify-content:flex-end}
  .tw table.cards td{width:auto!important}
  .tw table.cards td{flex-wrap:wrap}.tw table.cards td .ferr,.tw table.cards td .fhint{flex-basis:100%;text-align:right;order:3;margin:0}
  .tw table.cards td > div.note{flex-basis:100%;text-align:left}
  .tw table.cards td input{max-width:60%;width:160px}
  .tw table.cards tr.clk:hover td{background:none}
  /* dialogs fill the screen, actions stay reachable */
  .ov{padding:0}
  .dlg,.dlg.wide{max-width:none;min-height:100%;border-radius:0;margin:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
  .dlg > .row:last-child{position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(4px + env(safe-area-inset-bottom,0px));margin-top:auto;border-top:1px solid var(--line)}
  .dlg > .row:last-child .btn{flex:1 1 auto}
  .actions{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5;border-top:1px solid var(--line)}
  .actions .btn{flex:1 1 auto}
  .filters{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  img.onload = function(){ var max = 1600, s = Math.min(1, max/Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);

/* ---------- accounts: username + password through Firebase Authentication ---------- */
var DOMAIN = '@khatif-warehouse.app';

var second = null;

  if(/email-already-in-use/.test(c)) return 'اسم المستخدم مستخدم من قبل.';
  if(/weak-password/.test(c)) return 'كلمة المرور قصيرة. اكتب 6 أحرف أو أرقام على الأقل.';
  if(/invalid-email/.test(c)) return 'اسم المستخدم يقبل الحروف الإنجليزية والأرقام والنقطة والشرطة فقط.';

  if(/network/.test(c)) return 'تعذّر الاتصال بالإنترنت.';
  if(/operation-not-allowed/.test(c)) return 'تسجيل الدخول بكلمة المرور غير مفعّل في Firebase (Authentication > Email/Password).';

function validUser(u){ return /^[a-z0-9][a-z0-9._-]{2,31}$/.test(String(u||'').trim().toLowerCase()); }
var DEMO_COLS = ['items','stock','invoices','supplies','transfers','log','files'];
window.AUTH = !auth ? null : {
  state:function(){ return new Promise(function(res){ var off = auth.onAuthStateChanged(function(u){ off();
      fs.doc('meta/setup').get().then(function(s){ res({uid:u?u.uid:null, needsSetup:!s.exists}); }).catch(function(){ res({uid:u?u.uid:null, needsSetup:false}); }); }); }); },
  validUser:validUser, msg:authMsg,
  signIn:function(u, p){ if(!validUser(u)) return Promise.reject({code:'auth/invalid-email'});
    var name = String(u).trim().toLowerCase();
    /* after a password reset the login email changes; logins/{username} says which one is current */
    return fs.doc('logins/'+name).get().then(function(s){ return s.exists && s.data().email ? s.data().email : emailOf(name); }, function(){ return emailOf(name); })
      .then(function(email){ return auth.signInWithEmailAndPassword(email, p); }).then(function(){ location.reload(); }); },
  signOut:function(){ return auth.signOut().then(function(){ location.hash = ''; location.reload(); }); },
  createUser:function(u, p){
    if(!validUser(u)) return Promise.reject({code:'auth/invalid-email'});
    if(!second) second = firebase.initializeApp(FB_CONFIG, 'second');
    var name = String(u).trim().toLowerCase(), email = emailOf(name);
    return second.auth().createUserWithEmailAndPassword(email, p).then(function(c){ var uid = c.user.uid;
      return second.auth().signOut().then(function(){ return fs.doc('logins/'+name).set({email:email, uid:uid}); }).then(function(){ return uid; }); });
  },
  /* owner sets a new password for an employee: a fresh login is made under the same username, the old one is switched off for good */
  resetPassword:function(user, newP){
    if(!user || !user.username) return Promise.reject({code:'no-user'});
    if(!second) second = firebase.initializeApp(FB_CONFIG, 'second');
    var name = String(user.username).trim().toLowerCase(), email = name + '.' + Date.now().toString(36) + DOMAIN, uid;
    return second.auth().createUserWithEmailAndPassword(email, newP).then(function(c){ uid = c.user.uid; return second.auth().signOut(); }).then(function(){
      var copy = {}; Object.keys(user).forEach(function(k){ if(k !== 'id') copy[k] = user[k]; });
      copy = JSON.parse(JSON.stringify(copy)); copy.prevUid = user.id; copy.active = true; copy.frozenByBranch = false; delete copy.movedTo;
      var b = fs.batch();
      b.set(fs.doc('users/'+uid), copy);

  changePassword:function(oldP, newP){ var u = auth.currentUser; if(!u) return Promise.reject({code:'auth/no-user'});
    var cred = firebase.auth.EmailAuthProvider.credential(u.email, oldP);
    return u.reauthenticateWithCredential(cred).then(function(){ return u.updatePassword(newP); }); },
  setup:function(name, u, p, clean){
    if(!validUser(u)) return Promise.reject({code:'auth/invalid-email'});
    var uid;
    return auth.createUserWithEmailAndPassword(emailOf(u), p).then(function(c){ uid = c.user.uid;
      return fs.collection('warehouses').limit(1).get().catch(function(){ return {empty:true}; });
    }).then(function(){
      var b = fs.batch(); var now = new Date().toISOString();
      b.set(fs.doc('meta/setup'), {owner:uid, at:now});
      b.set(fs.doc('users/'+uid), {name:name, username:u.trim().toLowerCase(), phone:'', cityId:'', warehouseId:'', isOwner:true, perms:{}, templateId:'', active:true});
      return b.commit();
    }).then(function(){
      /* now an owner: make sure cities, warehouses and permission groups exist */
      var S = window.SEED || {}, b = fs.batch();
      return fs.collection('templates').limit(1).get().then(function(q){
        if(q.empty) ['templates'].forEach(function(col){ Object.keys(S[col]||{}).forEach(function(id){ b.set(fs.collection(col).doc(id), S[col][id]); }); });
        return b.commit();
      });
    }).then(function(){
      if(!clean) return;
      var jobs = DEMO_COLS.map(function(col){ return fs.collection(col).get().then(function(q){ return Promise.all(q.docs.map(function(d){ return d.ref.delete(); })); }); });
      jobs.push(fs.collection('users').get().then(function(q){ return Promise.all(q.docs.filter(function(d){ return d.id !== uid; }).map(function(d){ return d.ref.delete(); })); }));
      ['invoice','supply','transfer'].forEach(function(k){ jobs.push(fs.doc('meta/'+k).delete()); });
      return Promise.all(jobs).catch(function(e){ console.warn('cleanup skipped', e); });

  }
};

window.claude = { use:function(name){
  if(name === 'db') return Promise.resolve(DB);
  if(name === 'downloads') return Promise.resolve(DL);
  if(name === 'assets') return Promise.resolve(AS);
  return Promise.resolve(null);
} };
})();

<script>
(function(){

const SCOPED = {}; PERM_GROUPS.forEach(g=>g.p.forEach(p=>{ if(p[2]) SCOPED[p[0]] = true; }));

/* ---------- state ---------- */
const S = {db:null, dl:null, ready:false, data:{cities:[],warehouses:[],templates:[],users:[],items:[],stock:[],invoices:[],supplies:[],transfers:[],requests:[],log:[]}, me:null, view:'home', f:{wh:'', q:'', cat:''}, iq:'', uq:'', lq:'', rq:{tab:'pending', q:''}, inv:{tab:'draft', sel:new Set(), q:''}, form:null, sup:null, tr:null, trTab:'pending', rep:{tab:'sales', wh:'', from:'', to:'', item:''}, lim:{stock:100, items:100}, navOpen:false, bell:false};

const $app = document.getElementById('app'), $modal = document.getElementById('modal'), $toast = document.getElementById('toast');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const byId = (list,id) => { if(!list) return undefined; let m = _idx.get(list); if(!m || m.n!==list.length){ m = new Map(); list.forEach(x=>m.set(x.id,x)); m.n = list.length; _idx.set(list,m); } return m.get(id); };
let toastT; function toast(msg){ $toast.textContent = msg; $toast.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{$toast.hidden = true;}, 2600); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* ---------- permission helpers ---------- */
function me(){ return S.me ? byId(S.data.users, S.me) : null; }

}

function renderAuth(){
  const setup = S.authMode==='setup';
  $app.innerHTML = `<div class="login">
    <div><h1 style="font-size:28px;font-weight:800">خاطف الأضواء</h1><p class="sub">نظام إدارة المخازن</p></div>
    <form class="card" id="auth-form" style="display:flex;flex-direction:column;gap:14px" novalidate>
      ${setup ? `<h2 style="font-size:19px">إعداد صاحب النظام</h2><p class="note">هذه أول مرة يُفتح فيها النظام. أنشئ حساب صاحب النظام، وهو الحساب الوحيد الذي يملك كل الصلاحيات.</p>
        <label class="f">اسمك<input id="a-name" autocomplete="name"></label>` : ''}
      <label class="f">اسم المستخدم<input id="a-user" dir="ltr" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="مثال: osama"></label>
      <label class="f">كلمة المرور<input id="a-pass" type="password" dir="ltr" autocomplete="${setup?'new-password':'current-password'}"></label>
      ${setup ? `<label class="f">تأكيد كلمة المرور<input id="a-pass2" type="password" dir="ltr" autocomplete="new-password"></label>
        <label style="display:flex;gap:10px;align-items:center;cursor:pointer"><input type="checkbox" id="a-clean" checked>حذف بيانات التجربة (المستخدمون والأصناف والفواتير التجريبية)</label>
        <p class="note">اسم المستخدم: حروف إنجليزية صغيرة وأرقام، 3 أحرف على الأقل. كلمة المرور: 6 أحرف على الأقل.</p>` : ''}
      <p class="err" hidden></p>
      <button class="btn" type="submit" id="a-go">${setup?'إنشاء الحساب والدخول':'دخول'}</button>
      ${setup?'':'<p class="note">نسيت كلمة المرور؟ تواصل مع صاحب النظام.</p>'}
    </form></div>`;
  enhance($app);
  const f = document.getElementById('auth-form'), errEl = f.querySelector('.err'), btn = document.getElementById('a-go');
  const err = (m, sel) => { errEl.textContent = m; errEl.hidden = false; fieldErr(f, sel, m); };
  document.getElementById(setup?'a-name':'a-user').focus();
  f.addEventListener('submit', async ev => {
    ev.preventDefault(); errEl.hidden = true;
    const u = val('a-user').trim().toLowerCase(), p = val('a-pass');
    if(!window.AUTH.validUser(u)) return err('اسم المستخدم: حروف إنجليزية صغيرة وأرقام والنقطة والشرطة، 3 أحرف على الأقل.', 'a-user');
    if(p.length < 6) return err('كلمة المرور 6 أحرف على الأقل.', 'a-pass');
    btn.disabled = true; btn.textContent = 'جاري التنفيذ…';
    try{
      if(setup){ const n = val('a-name').trim(); if(!n){ btn.disabled = false; btn.textContent = 'إنشاء الحساب والدخول'; return err('اكتب اسمك.', 'a-name'); }
        if(p !== val('a-pass2')){ btn.disabled = false; btn.textContent = 'إنشاء الحساب والدخول'; return err('كلمتا المرور غير متطابقتين.', 'a-pass2'); }
        await window.AUTH.setup(n, u, p, document.getElementById('a-clean').checked); }
      else await window.AUTH.signIn(u, p);
    }catch(e){ err(window.AUTH.msg(e)); btn.disabled = false; btn.textContent = setup?'إنشاء الحساب والدخول':'دخول'; }
  });
}

VIEWS.home = function(){

  S.data.items.forEach(it=>{ vis.forEach(w=>{ const s = stockOf(it.id,w.id); const av = (s.qty||0)-(s.frozen||0); if(it.minQty>0 && av < it.minQty && s.itemId) lows.push({it,w,av}); }); });

function anyAdjust(){ return visibleWh().some(w=>scopeOk('stock_adjust', w.id)) || has('stock_adjust'); }
function cats(){ return Array.from(new Set(S.data.items.map(i=>i.category).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ar')); }

function stockRows(){
  const vis = sortWh(visibleWh());
  const whs = S.f.wh ? vis.filter(w=>w.id===S.f.wh) : vis;
  const q = S.f.q.trim();
  const rows = [];
  S.data.items.filter(it => (!S.f.cat || it.category===S.f.cat) && matchQ(q, it.name, it.code, it.brand))
    .sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'))
    .forEach(it => whs.forEach(w => { const s = stockOf(it.id,w.id); if(!s.itemId && !S.f.all && !q) return; rows.push({it, w, qty:s.qty||0, frozen:s.frozen||0, av:(s.qty||0)-(s.frozen||0)}); }));
  return rows;
}

/* ---------- invoices ---------- */
function visibleInvoices(){
  const u = me(); if(!u) return [];
  return S.data.invoices.filter(i => u.isOwner || i.createdBy===S.me || i.whId===u.warehouseId || scopeOk('inv_approve', i.whId) || scopeOk('inv_cancel', i.whId));
}
const canApprove = inv => isOwner() || (scopeOk('inv_approve', inv.whId) && inv.createdBy !== S.me);
const canPost = inv => has('inv_post') && ((me()||{}).isOwner || inv.createdBy===S.me || inv.whId===(me()||{}).warehouseId);
const canEditDraft = inv => inv.status==='draft' && ((me()||{}).isOwner || ((inv.createdBy===S.me || inv.whId===(me()||{}).warehouseId) && has('inv_edit_draft')));
const pieces = inv => (inv.lines||[]).reduce((a,l)=>a+(l.qty||0),0);
const fmtDate = s => s ? new Date(s).toLocaleString('ar-SA-u-nu-latn',{dateStyle:'short',timeStyle:'short'}) : '—';
const userName = id => (byId(S.data.users,id)||{}).name || '—';
function invWhChoices(){ const u = me(); if(!u) return []; if(u.isOwner) return sortWh(S.data.warehouses); return [wh(u.warehouseId)].filter(Boolean); }

function readForm(){
  const F = S.form; if(!F) return;
  const g = id => document.getElementById(id);
  if(g('inv-wh')) F.whId = g('inv-wh').value;
  if(g('inv-cust')) F.cust = g('inv-cust').value;
  if(g('inv-phone')) F.phone = g('inv-phone').value;
  if(g('inv-plate')) F.plate = g('inv-plate').value;
  if(g('inv-car')) F.car = g('inv-car').value;
  if(g('inv-note')) F.note = g('inv-note').value;
  F.lines.forEach((l,i)=>{ const q = document.querySelector(`[data-lq="${i}"]`), p = document.querySelector(`[data-lp="${i}"]`); if(q) l.qty = q.value; if(p) l.price = p.value; });
}
function availFor(itemId, whId){
  const s = stockOf(itemId, whId); let av = (s.qty||0)-(s.frozen||0);
  const F = S.form; if(F && F.orig && F.orig.whId===whId && F.orig.status==='draft') (F.orig.lines||[]).forEach(l=>{ if(l.itemId===itemId) av += l.qty; });
  return av;
}
function startForm(inv){
  const ch = invWhChoices();
  S.form = inv ? {id:inv.id, orig:inv, whId:inv.whId, cust:inv.customerName||'', phone:inv.customerPhone||'', plate:inv.carPlate||'', car:inv.carModel||'', note:inv.note||'', lines:(inv.lines||[]).map(l=>({itemId:l.itemId, qty:String(l.qty), price:String(l.price)}))}
               : {id:null, orig:null, whId:((ch.find(w=>w.id===(me()||{}).warehouseId))||ch[0]||{}).id||'', cust:'', phone:'', note:'', lines:[]};
}

function clearFieldErrs(root){ (root||document).querySelectorAll('.bad-f').forEach(x=>{ x.classList.remove('bad-f'); x.removeAttribute('aria-invalid'); }); (root||document).querySelectorAll('.ferr').forEach(x=>x.remove()); }
/* mark the field that is wrong and write the reason right under it */
function fieldErr(root, sel, msg){
  clearFieldErrs(root);
  if(!sel) return;
  const el = typeof sel==='string' ? (root.querySelector(sel.startsWith('[')||sel.startsWith('.')||sel.startsWith('#')?sel:'#'+sel)) : sel; if(!el) return;
  el.classList.add('bad-f'); el.setAttribute('aria-invalid','true');
  const p = document.createElement('p'); p.className = 'ferr'; p.setAttribute('role','alert'); p.textContent = msg;
  const host = el.closest('.fx') || el; host.insertAdjacentElement('afterend', p);
  el.focus({preventScroll:true}); el.scrollIntoView({block:'center', behavior:'smooth'});
}
function formErr(msg, sel){ const m = document.getElementById('main'); const e = m && m.querySelector('.err'); if(e){ e.textContent = msg; e.hidden = false; } if(m) fieldErr(m, sel, msg); if(!e && !sel) toast(msg); }
function updTotals(){
  readForm(); const F = S.form; if(!F) return;
  F.lines.forEach((l,i)=>{ const c = document.getElementById('lt-'+i); if(c) c.textContent = num((+l.qty||0)*(+l.price||0)); });
  const t = document.getElementById('inv-total'); if(t) t.textContent = num(F.lines.reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0));
}

async function bump(itemId, whId, dQty, dFrozen){
  const ref = S.db.doc('stock/'+itemId+'__'+whId); const snap = await ref.get();
  const cur = snap.exists ? snap.data() : {qty:0, frozen:0};
  await ref.set({itemId, whId, qty:(cur.qty||0)+dQty, frozen:Math.max(0,(cur.frozen||0)+dFrozen)});
}
function agg(lines){ const m = {}; (lines||[]).forEach(l=>{ m[l.itemId] = (m[l.itemId]||0)+(+l.qty||0); }); return m; }
async function nextNo(key, prefix){
  key = key || 'invoice'; prefix = prefix || 'F-';
  if(S.db.next) return S.db.next(key, prefix);
  const ref = S.db.doc('meta/'+key);
  for(let i=0;i<6;i++){
    let ok = true; try{ const r = await ref.acquire({holder:(S.me||'x')+Math.random().toString(36).slice(2), ttlMs:4000}); ok = r.acquired; }catch(e){ ok = true; }
    if(ok){ const s = await ref.get(); const n = ((s.exists && s.data().n) || 1000) + 1; await ref.set({n}); return prefix+n; }
    await new Promise(r=>setTimeout(r, 400 + Math.random()*400));
  }
  return prefix+Date.now().toString().slice(-6);
}
async function saveInvoice(mode, btn){
  readForm(); const F = S.form;
  const lines = F.lines.map(l=>({itemId:l.itemId, qty:parseInt(l.qty), price:parseFloat(l.price)}));
  if(!lines.length) return formErr('أضف قطعة واحدة على الأقل: ابحث عن الصنف باسمه أو رقمه واختره.', 'pk-inv');
  for(const [li,l] of lines.entries()){ const it = byId(S.data.items,l.itemId); const nm = it?it.name:'';
    if(!(l.qty>=1)) return formErr('اكتب كمية صحيحة لـ '+nm+' (رقم صحيح 1 أو أكثر).', `[data-lq="${li}"]`);
    if(isNaN(l.price) || l.price<0) return formErr('السعر إجباري. اكتب سعر '+nm+'.', `[data-lp="${li}"]`);
    if(l.qty > availFor(l.itemId, F.whId)) return formErr('الكمية المطلوبة من '+nm+' أكبر من المتاح. المتاح '+num(availFor(l.itemId,F.whId))+' فقط.', `[data-lq="${li}"]`); }
  if(!F.cust.trim()) return formErr('اكتب اسم العميل.', 'inv-cust');
  if(!F.phone.trim()) return formErr('اكتب رقم جوال العميل.', 'inv-phone');
  if(!/^[0-9+\s-]{7,15}$/.test(F.phone.trim())) return formErr('رقم الجوال غير صحيح. اكتب أرقام فقط، مثال 05xxxxxxxx.', 'inv-phone');
  if(mode==='approve' && !isOwner()) mode = 'post';
  if(mode==='post' && isOwner()) mode = 'approve';
  btn.disabled = true;
  try{
    const now = new Date().toISOString();
    if(F.orig && F.orig.status==='draft'){ const old = agg(F.orig.lines); for(const k in old) await bump(k, F.orig.whId, 0, -old[k]); }
    const a = agg(lines);
    for(const k in a){ if(mode==='approve') await bump(k, F.whId, -a[k], 0); else await bump(k, F.whId, 0, a[k]); }
    const rich = lines.map(l=>{ const it = byId(S.data.items,l.itemId)||{}; return Object.assign({name:it.name||'', code:it.code||''}, l); });
    const total = rich.reduce((s,l)=>s+l.qty*l.price,0);
    const status = mode==='approve'?'approved':(mode==='post'?'posted':'draft');
    const d = {whId:F.whId, customerName:F.cust.trim(), customerPhone:F.phone.trim(), carPlate:(F.plate||'').trim(), carModel:(F.car||'').trim(), note:F.note.trim(), lines:rich, total, status, updatedAt:now};
    if(status==='posted') d.postedAt = now;
    if(status==='approved'){ d.decidedAt = now; d.decidedBy = S.me; d.postedAt = now; }
    let no;
    if(F.id){ no = F.orig.no; await S.db.doc('invoices/'+F.id).update(d); }
    else { no = await nextNo(); Object.assign(d, {no, createdBy:S.me, createdAt:now}); await S.db.collection('invoices').add(d); }
    logAct('invoice', `${F.id?'عدّل':'أنشأ'} الفاتورة ${no} (${ST[status][0]}) · ${whName(F.whId)} · ${num(total)}`);
    S.form = null; S.inv.tab = status; S.inv.sel.clear(); location.hash = '#invoices';
    toast(status==='approved'?'تم حفظ الفاتورة واعتمادها':status==='posted'?'تم حفظ الفاتورة وترحيلها':'تم حفظ المسودة');
  }catch(e){ dbErr(e); btn.disabled = false; }
}
async function postSel(){
  const list = visibleInvoices().filter(i=>i.status==='draft' && S.inv.sel.has(i.id) && canPost(i)); if(!list.length) return;
  const now = new Date().toISOString(), batch = 'B-'+Date.now().toString(36); let ap = 0;
  try{ for(const i of list){
      if(canApprove(i)){ const a = agg(i.lines); for(const k in a) await bump(k, i.whId, -a[k], -a[k]); await S.db.doc('invoices/'+i.id).update({status:'approved', postedAt:now, decidedAt:now, decidedBy:S.me, batchId:batch}); ap++; }
      else await S.db.doc('invoices/'+i.id).update({status:'posted', postedAt:now, batchId:batch}); }
    logAct('invoice', `رحّل ${list.length} فاتورة: ${list.map(i=>i.no).join('، ')}`);
    S.inv.sel.clear(); toast(ap?`تم الترحيل، واعتُمدت ${ap} مباشرة`:'تم ترحيل الفواتير للاعتماد'); render();
  }catch(e){ dbErr(e); }
}
async function approveSel(){
  const list = visibleInvoices().filter(i=>i.status==='posted' && S.inv.sel.has(i.id) && canApprove(i)); if(!list.length) return;
  const now = new Date().toISOString();
  try{ for(const i of list){ const a = agg(i.lines); for(const k in a) await bump(k, i.whId, -a[k], -a[k]); await S.db.doc('invoices/'+i.id).update({status:'approved', decidedAt:now, decidedBy:S.me}); }
    logAct('invoice', `اعتمد ${list.length} فاتورة: ${list.map(i=>i.no).join('، ')}`);
    S.inv.sel.clear(); toast('تم اعتماد الفواتير وخصمها من المخزون'); render();
  }catch(e){ dbErr(e); }
}
function reasonModal(kind, ids){
  M = {type:kind, ids};
  const t = {reject:['رفض الفواتير','سبب الرفض يظهر للفرع، وترجع الكمية متاحة.','رفض'], rejecttr:['رفض طلب النقل','يُفك تجميد الكمية في المخزن المرسل، ويصل السبب لصاحب الطلب.','رفض'],cancelapp:['إلغاء فاتورة معتمدة', isOwner()?'ترجع الكميات لمخزن الفرع، ويُسجّل السبب.':'يُرسل الطلب للمدير، ولا تُلغى الفاتورة إلا بموافقته.', isOwner()?'إلغاء الفاتورة':'إرسال الطلب'], rejectreq:['رفض الطلب','يصل السبب لصاحب الطلب، ولا يتغير شيء في المخزون.','رفض']}[kind];
  openModal(`<h2>${t[0]}</h2><p class="note">${t[1]}</p><label class="f">السبب *<textarea id="m-reason" rows="2"></textarea></label><p class="err" hidden></p>
  <div class="row" style="justify-content:flex-end"><button class="btn sec" data-act="close">رجوع</button><button class="btn danger" data-act="doreason">${t[2]}</button></div>`);
}
async function doReason(){
  const why = val('m-reason').trim(); if(!why) return showErr('اكتب السبب.', 'm-reason');
  const now = new Date().toISOString();
  try{
    if(M.type==='reject'){
      const list = visibleInvoices().filter(i=>i.status==='posted' && M.ids.includes(i.id) && canApprove(i));
      for(const i of list){ const a = agg(i.lines); for(const k in a) await bump(k, i.whId, 0, -a[k]); await S.db.doc('invoices/'+i.id).update({status:'rejected', decidedAt:now, decidedBy:S.me, rejectReason:why}); }
      logAct('invoice', `رفض ${list.length} فاتورة: ${list.map(i=>i.no).join('، ')} · ${why}`); S.inv.sel.clear(); toast('تم رفض الفواتير');
    } else if(M.type==='rejectreq'){
      if(!isOwner()) return showErr('الرفض للمدير فقط.');
      await rejectRequest(M.ids[0], M.ids[1], why); toast('تم رفض الطلب');
    } else if(M.type==='rejecttr'){
      const tr = byId(S.data.transfers, M.ids[0]); if(!tr || tr.status!=='pending' || !canApproveTr(tr)) return showErr('لا يمكن رفض هذا الطلب.');
      const a = agg(tr.lines); for(const k in a) await bump(k, tr.fromWh, 0, -a[k]);
      await S.db.doc('transfers/'+tr.id).update({status:'rejected', decidedBy:S.me, decidedAt:now, reason:why});
      logAct('transfer', `رفض النقل ${tr.no} · ${why}`); toast('تم رفض طلب النقل');
    } else {
      const i = byId(S.data.invoices, M.ids[0]); if(!i || i.status!=='approved' || !scopeOk('inv_cancel', i.whId)) return showErr('لا يمكن إلغاء هذه الفاتورة.');
      if(!isOwner()){ if(pendingReq('invoice_cancel', r=>r.payload.invoiceId===i.id)) return showErr('يوجد طلب إلغاء لهذه الفاتورة بانتظار المدير.');
        await createRequest('invoice_cancel', {invoiceId:i.id, why}, `طلب إلغاء الفاتورة المعتمدة ${i.no} (${num(i.total)}) · ${why}`, i.whId); closeModal(); toast('أُرسل طلب الإلغاء للمدير'); return; }
      const a = agg(i.lines); for(const k in a) await bump(k, i.whId, a[k], 0);
      await S.db.doc('invoices/'+i.id).update({status:'cancelled', cancelledAt:now, cancelledBy:S.me, cancelReason:why});
      logAct('invoice', `ألغى الفاتورة المعتمدة ${i.no} وأرجع الكميات · ${why}`); toast('تم إلغاء الفاتورة وإرجاع الكميات');
    }
    closeModal(); render();
  }catch(e){ dbErr(e); }
}

async function downloadPdf(btn){
  const i = byId(S.data.invoices, M.id); if(!i) return;
  if(!window.html2canvas || !window.jspdf){ toast('مكتبة PDF لم تُحمّل، أعد تحميل الصفحة'); return; }
  if(!S.dl){ toast('التنزيل غير متاح في هذا العرض'); return; }
  btn.disabled = true; btn.textContent = 'جاري التجهيز…';
  const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-10000px;top:0;z-index:-1'; host.innerHTML = sheetHtml(i); document.body.appendChild(host);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(host.firstElementChild, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const pdf = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
    const W = 595.28, H = 841.89, h = canvas.height * W / canvas.width, img = canvas.toDataURL('image/jpeg', 0.92);
    let y = 0; pdf.addImage(img, 'JPEG', 0, 0, W, h); while(h - y > H + 1){ y += H; pdf.addPage(); pdf.addImage(img, 'JPEG', 0, -y, W, h); }
    await S.dl.save({filename:'فاتورة-'+i.no+'.pdf', data:pdf.output('blob')}); toast('تم تنزيل الفاتورة');
  }catch(e){ if(!(e && e.code==='declined')) toast('تعذّر إنشاء PDF'); }
  finally{ host.remove(); btn.disabled = false; btn.textContent = 'تنزيل PDF'; }
}

function supErr(msg, sel){ formErr(msg, sel); }
async function saveSupply(btn){
  readSup(); const F = S.sup, loc = F.source==='local';
  if(!scopeOk('supply', F.whId)) return supErr('لا تملك صلاحية التوريد لهذا المخزن.');
  const lines = F.lines.map(l=>({itemId:l.itemId, qty:parseInt(l.qty), price:loc?parseFloat(l.price):null}));
  if(loc){ if(!F.shop.trim()) return supErr('اكتب اسم المحل أو المورّد.', 's-shop'); if(!F.place.trim()) return supErr('اكتب مكان المحل.', 's-place');
    if(!F.pno.trim()) return supErr('اكتب رقم فاتورة الشراء.', 's-pno'); if(!F.pdate) return supErr('اختر تاريخ فاتورة الشراء.', 's-pdate');
    if(F.pdate > new Date().toISOString().slice(0,10)) return supErr('تاريخ فاتورة الشراء في المستقبل. تأكد من التاريخ.', 's-pdate'); }
  if(!lines.length) return supErr('أضف صنفاً واحداً على الأقل: ابحث عن الصنف باسمه أو رقمه واختره.', 'pk-sup');
  for(const [li,l] of lines.entries()){ const nm = (byId(S.data.items,l.itemId)||{}).name||''; if(!(l.qty>=1)) return supErr('اكتب كمية صحيحة لـ '+nm+' (رقم صحيح 1 أو أكثر).', `[data-sq="${li}"]`); if(loc && (isNaN(l.price)||l.price<0)) return supErr('اكتب سعر شراء '+nm+'.', `[data-sp="${li}"]`); }
  if(loc){ if(!S.assets) return supErr('إرفاق صورة الفاتورة غير متاح في هذا العرض.');
    if(!F.file) return supErr('أرفق صورة فاتورة الشراء.', 's-file'); }
  btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  try{
    let attachmentId = '';
    if(loc){ const r = await S.assets.upload(F.file); attachmentId = r.id; }
    const direct = isOwner();
    if(direct){ const a = agg(lines); for(const k in a) await bump(k, F.whId, a[k], 0); }
    const rich = lines.map(l=>{ const it = byId(S.data.items,l.itemId)||{}; return {itemId:l.itemId, name:it.name||'', code:it.code||'', qty:l.qty, price:loc?l.price:null}; });
    const no = await nextNo('supply','S-'); const now = new Date().toISOString();
    const d = {no, source:F.source, whId:F.whId, lines:rich, note:F.note.trim(), createdBy:S.me, createdAt:now, attachmentId, status:direct?'approved':'pending'};
    if(direct){ d.decidedBy = S.me; d.decidedAt = now; }
    if(loc) Object.assign(d, {shop:F.shop.trim(), place:F.place.trim(), purchaseNo:F.pno.trim(), purchaseDate:F.pdate, total:rich.reduce((s,l)=>s+l.qty*l.price,0)}); else d.ref = F.ref.trim();
    await S.db.collection('supplies').add(d);
    logAct('supply', `${direct?'توريد':'طلب توريد'} ${no} (${loc?'شراء محلي من '+d.shop:'مستوردة'}) إلى ${whName(F.whId)} · ${num(pieces(d))} قطعة`);
    S.sup = null; toast(direct?'تم حفظ التوريد وإضافة الكميات':'أُرسل التوريد للمدير، وتُضاف الكميات بعد موافقته'); render();
  }catch(e){ if(e && e.code && /too_large|unsupported|invalid/.test(e.code)) supErr('تعذّر رفع المرفق. استخدم صورة أو PDF أصغر من 20 ميجا.'); else dbErr(e); btn.disabled = false; btn.textContent = 'حفظ التوريد'; }
}

async function saveTransfer(btn){
  readTr(); const F = S.tr;
  if(!scopeOk('transfer', F.from)) return formErr('لا تملك صلاحية النقل من هذا المخزن.');
  if(!F.to) return formErr('اختر المخزن المستلم.', 't-to');
  const lines = F.lines.map(l=>({itemId:l.itemId, qty:parseInt(l.qty)}));
  if(!lines.length) return formErr('أضف صنفاً واحداً على الأقل: ابحث عن الصنف باسمه أو رقمه واختره.', 'pk-tr');
  for(const [li,l] of lines.entries()){ const s = stockOf(l.itemId, F.from), av = (s.qty||0)-(s.frozen||0), nm = (byId(S.data.items,l.itemId)||{}).name||'';
    if(!(l.qty>=1)) return formErr('اكتب كمية صحيحة لـ '+nm+' (رقم صحيح 1 أو أكثر).', `[data-tq="${li}"]`); if(l.qty>av) return formErr('كمية '+nm+' أكبر من المتاح. المتاح '+num(av)+' فقط.', `[data-tq="${li}"]`); }
  btn.disabled = true;
  try{
    const now = new Date().toISOString(), direct = isOwner(), a = agg(lines);
    for(const k in a){ if(direct){ await bump(k, F.from, -a[k], 0); await bump(k, F.to, a[k], 0); } else await bump(k, F.from, 0, a[k]); }
    const no = await nextNo('transfer','N-');
    const d = {no, fromWh:F.from, toWh:F.to, note:F.note.trim(), lines:lines.map(l=>({itemId:l.itemId, name:(byId(S.data.items,l.itemId)||{}).name||'', qty:l.qty})), status:direct?'approved':'pending', createdBy:S.me, createdAt:now};
    if(direct){ d.decidedBy = S.me; d.decidedAt = now; }
    await S.db.collection('transfers').add(d);
    logAct('transfer', `${direct?'نقل':'طلب نقل'} ${no} من ${whName(F.from)} إلى ${whName(F.to)} · ${num(pieces(d))} قطعة`);
    S.tr = null; S.trTab = d.status; toast(direct?'تم النقل':'تم إرسال طلب النقل للموافقة'); render();
  }catch(e){ dbErr(e); btn.disabled = false; }
}
async function approveTr(id){
  const t = byId(S.data.transfers,id); if(!t || t.status!=='pending' || !canApproveTr(t)) return;
  try{ const a = agg(t.lines); for(const k in a){ await bump(k, t.fromWh, -a[k], -a[k]); await bump(k, t.toWh, a[k], 0); }
    await S.db.doc('transfers/'+id).update({status:'approved', decidedBy:S.me, decidedAt:new Date().toISOString()});
    logAct('transfer', `وافق على النقل ${t.no} من ${whName(t.fromWh)} إلى ${whName(t.toWh)}`); toast('تمت الموافقة ونُقلت الكميات'); }catch(e){ dbErr(e); }
}

/* ---------- reports ---------- */
function repWh(){ return sortWh(S.data.warehouses.filter(w=>scopeOk('reports', w.id))); }
function repRows(){
  const R = S.rep, whs = repWh(), ids = new Set((R.wh?whs.filter(w=>w.id===R.wh):whs).map(w=>w.id)), showP = has('supply_prices');
  if(R.tab==='sales'){
    const inv = S.data.invoices.filter(i=>i.status==='approved' && ids.has(i.whId) && inRange(i.decidedAt||i.createdAt, R.from, R.to));
    const byWh = {}, byItem = {}, bySeller = {};
    inv.forEach(i=>{ const w = byWh[i.whId] = byWh[i.whId] || {n:0,p:0,t:0}; w.n++; w.p += pieces(i); w.t += i.total||0;
      const s = bySeller[i.createdBy] = bySeller[i.createdBy] || {n:0,t:0}; s.n++; s.t += i.total||0;
      (i.lines||[]).forEach(l=>{ const it = byItem[l.itemId] = byItem[l.itemId] || {name:l.name, code:l.code, q:0, t:0}; it.q += l.qty; it.t += l.qty*l.price; }); });
    return {inv, byWh, byItem, bySeller};
  }
  if(R.tab==='supply') return {list:S.data.supplies.filter(s=>ids.has(s.whId) && inRange(s.createdAt, R.from, R.to)).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')), showP};
  if(R.tab==='transfers') return {list:S.data.transfers.filter(t=>(ids.has(t.fromWh)||ids.has(t.toWh)) && inRange(t.createdAt, R.from, R.to)).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))};
  const mv = []; const it = R.item;
  if(it){
    S.data.invoices.filter(i=>i.status==='approved').forEach(i=>(i.lines||[]).forEach(l=>{ if(l.itemId===it && ids.has(i.whId)) mv.push({at:i.decidedAt||i.createdAt, type:'بيع', wh:i.whId, d:-l.qty, ref:i.no}); }));
    S.data.invoices.filter(i=>i.status==='cancelled' && i.decidedAt).forEach(i=>(i.lines||[]).forEach(l=>{ if(l.itemId===it && ids.has(i.whId)) { mv.push({at:i.decidedAt, type:'بيع', wh:i.whId, d:-l.qty, ref:i.no}); mv.push({at:i.cancelledAt, type:'إلغاء بيع', wh:i.whId, d:l.qty, ref:i.no}); } }));
    S.data.supplies.forEach(s=>(s.lines||[]).forEach(l=>{ if(l.itemId===it && ids.has(s.whId)) mv.push({at:s.createdAt, type:'توريد', wh:s.whId, d:l.qty, ref:s.no}); }));
    S.data.transfers.filter(t=>t.status==='approved').forEach(t=>(t.lines||[]).forEach(l=>{ if(l.itemId!==it) return; if(ids.has(t.fromWh)) mv.push({at:t.decidedAt, type:'نقل خارج', wh:t.fromWh, d:-l.qty, ref:t.no}); if(ids.has(t.toWh)) mv.push({at:t.decidedAt, type:'نقل داخل', wh:t.toWh, d:l.qty, ref:t.no}); }));
    S.data.log.filter(l=>l.type==='stock' && l.itemId===it && ids.has(l.whId)).forEach(l=>mv.push({at:l.at, type:'تعديل يدوي', wh:l.whId, d:l.delta||0, ref:l.text}));
  }
  return {mv:mv.filter(m=>inRange(m.at, R.from, R.to)).sort((a,b)=>(b.at||'').localeCompare(a.at||''))};
}

function notes(){

  S.data.invoices.forEach(i=>{ if(i.status==='posted' && canApprove(i)) out.push({t:`الفاتورة ${i.no} من ${whName(i.whId)} تنتظر اعتمادك`, h:'#invoices', tab:'posted', k:'act'});
    if(i.createdBy===S.me && i.decidedAt && Date.parse(i.decidedAt)>week && i.decidedBy!==S.me){ if(i.status==='rejected') out.push({t:`رُفضت فاتورتك ${i.no}: ${i.rejectReason||''}`, h:'#invoices', tab:'rejected', k:'bad'}); if(i.status==='approved') out.push({t:`اعتُمدت فاتورتك ${i.no}`, h:'#invoices', tab:'approved', k:'ok'}); } });
  S.data.transfers.forEach(t=>{ if(t.status==='pending' && canApproveTr(t)) out.push({t:`طلب نقل ${t.no} من ${whName(t.fromWh)} إلى ${whName(t.toWh)} ينتظر موافقتك`, h:'#transfers', k:'act'});
    if(t.createdBy===S.me && t.decidedAt && Date.parse(t.decidedAt)>week && t.decidedBy!==S.me) out.push({t:t.status==='approved'?`تمت الموافقة على النقل ${t.no}`:`رُفض النقل ${t.no}: ${t.reason||''}`, h:'#transfers', k:t.status==='approved'?'ok':'bad'}); });
  allRequests().forEach(r=>{ if(r.kind==='tr') return;
    if(r.status==='pending' && u.isOwner) out.push({t:`${RQ[r.type]||'طلب'} من ${userName(r.by)}: ${r.text}`, h:'#requests', k:'act'});
    if(!u.isOwner && r.decidedAt && Date.parse(r.decidedAt)>week) out.push({t:r.status==='approved'?`وافق المدير: ${r.text}`:`رفض المدير: ${r.text}${r.reason?' · '+r.reason:''}`, h:'#requests', k:r.status==='approved'?'ok':'bad'}); });

async function createRequest(type, payload, text, whId){

/* one list of everything waiting for (or decided by) the owner */
function allRequests(){

  S.data.requests.forEach(r=>out.push({kind:'req', id:r.id, type:r.type, status:r.status, text:r.text, by:r.createdBy, at:r.createdAt, decidedAt:r.decidedAt, decidedBy:r.decidedBy, reason:r.reason, whId:r.whId, raw:r}));
  S.data.supplies.filter(s=>s.status).forEach(s=>out.push({kind:'sup', id:s.id, type:'supply', status:s.status, text:`توريد ${s.no} (${s.source==='local'?'شراء محلي من '+(s.shop||''):'مستوردة'}) إلى ${whName(s.whId)} · ${num(pieces(s))} قطعة`, by:s.createdBy, at:s.createdAt, decidedAt:s.decidedAt, decidedBy:s.decidedBy, reason:s.reason, whId:s.whId, raw:s}));

async function approveRequest(kind, id, btn){
  if(!isOwner()) return; if(btn) btn.disabled = true;
  const now = new Date().toISOString(), dec = {status:'approved', decidedBy:S.me, decidedAt:now};
  try{
    if(kind==='tr'){ await approveTr(id); return; }
    if(kind==='sup'){ const s = byId(S.data.supplies,id); if(!s || s.status!=='pending') return;
      const a = agg(s.lines); for(const k in a) await bump(k, s.whId, a[k], 0);
      await S.db.doc('supplies/'+id).update(dec); logAct('supply', `وافق على التوريد ${s.no} وأُضيفت الكميات إلى ${whName(s.whId)}`); toast('تمت الموافقة وأُضيفت الكميات'); return; }
    const r = byId(S.data.requests,id); if(!r || r.status!=='pending') return; const p = r.payload||{};
    if(r.type==='item_create'){ if(S.data.items.some(i=>lc(i.code)===lc(p.data.code))){ toast('يوجد صنف بنفس رقم القطعة، ارفض الطلب أو عدّل الصنف'); if(btn) btn.disabled = false; return; }
      const ref = await S.db.collection('items').add(Object.assign({}, p.data, {createdAt:now, createdBy:r.createdBy, approvedBy:S.me})); dec.result = ref.id; }
    else if(r.type==='item_update'){ await S.db.doc('items/'+p.itemId).update(p.data); }
    else if(r.type==='item_delete'){ await S.db.doc('items/'+p.itemId).update({deleted:true, deletedAt:now, deletedBy:S.me, deleteReason:p.why}); }
    else if(r.type==='stock_adjust'){ const ref = S.db.doc('stock/'+p.itemId+'__'+p.whId); const sn = await ref.get(); const cur = sn.exists?sn.data():{qty:0,frozen:0};
      const nq = p.mode==='add' ? (cur.qty||0)+p.qty : p.qty; if(nq < (cur.frozen||0)){ toast('الكمية الجديدة أقل من المجمّد في الفواتير، ارفض الطلب'); if(btn) btn.disabled = false; return; }
      await ref.set({itemId:p.itemId, whId:p.whId, qty:nq, frozen:cur.frozen||0}); dec.result = (cur.qty||0)+' ← '+nq; }
    else if(r.type==='import'){ const c = await applyImport(p.rows||[], 'بطلب من '+userName(r.createdBy)); dec.result = `${c.made} جديد، ${c.upd} تحديث`; }
    else if(r.type==='invoice_cancel'){ const i = byId(S.data.invoices,p.invoiceId); if(!i || i.status!=='approved'){ toast('الفاتورة ليست معتمدة الآن'); if(btn) btn.disabled = false; return; }
      const a = agg(i.lines); for(const k in a) await bump(k, i.whId, a[k], 0);
      await S.db.doc('invoices/'+i.id).update({status:'cancelled', cancelledAt:now, cancelledBy:S.me, cancelReason:p.why, cancelRequestedBy:r.createdBy}); }
    await S.db.doc('requests/'+id).update(dec);
    logAct('request', 'وافق على: '+r.text, {requestId:id}); toast('تمت الموافقة');
  }catch(e){ dbErr(e); if(btn) btn.disabled = false; }
}
async function rejectRequest(kind, id, why){
  const now = new Date().toISOString(), dec = {status:'rejected', decidedBy:S.me, decidedAt:now, reason:why};
  if(kind==='sup'){ const s = byId(S.data.supplies,id); await S.db.doc('supplies/'+id).update(dec); logAct('supply', `رفض التوريد ${s?s.no:''} · ${why}`); return; }
  if(kind==='tr'){ const tr = byId(S.data.transfers,id); if(!tr || tr.status!=='pending') return; const a = agg(tr.lines); for(const k in a) await bump(k, tr.fromWh, 0, -a[k]);
    await S.db.doc('transfers/'+id).update(dec); logAct('transfer', `رفض النقل ${tr.no} · ${why}`); return; }
  const r = byId(S.data.requests,id); await S.db.doc('requests/'+id).update(dec); logAct('request', 'رفض: '+(r?r.text:'')+' · '+why);
}

async function toggleBranch(id){
  const w = wh(id); if(!w) return; const freeze = !w.frozen, now = new Date().toISOString();
  try{
    await S.db.doc('warehouses/'+id).update({frozen:freeze, frozenAt:freeze?now:null});
    for(const u of S.data.users.filter(u=>u.warehouseId===id && !u.isOwner && !u.movedTo)){
      if(freeze && u.active!==false) await S.db.doc('users/'+u.id).update({active:false, frozenByBranch:true});
      if(!freeze && u.frozenByBranch) await S.db.doc('users/'+u.id).update({active:true, frozenByBranch:false});
    }
    logAct('place',(freeze?'جمّد الفرع ':'ألغى تجميد الفرع ')+whName(id)); toast(freeze?'تم تجميد الفرع وإيقاف حسابات موظفيه':'تم إلغاء تجميد الفرع');
  }catch(e){ dbErr(e); }
}

/* ---------- reports per person: week / month / year ---------- */
function periodRange(type, ref){
  const d = ref ? new Date(ref+'T12:00:00') : new Date(); const iso = x => x.toISOString().slice(0,10);
  if(type==='year') return [d.getFullYear()+'-01-01', d.getFullYear()+'-12-31'];
  if(type==='month'){ const y = d.getFullYear(), m = d.getMonth(); return [iso(new Date(Date.UTC(y,m,1))), iso(new Date(Date.UTC(y,m+1,0)))]; }
  const day = (d.getDay()+1)%7; const s = new Date(d); s.setDate(d.getDate()-day); const e = new Date(s); e.setDate(s.getDate()+6); return [iso(s), iso(e)]; /* week starts Saturday */
}
function userStats(pid, f, t){
  const ids = new Set(idsOf(pid)), by = x => ids.has(x);
  const inv = S.data.invoices.filter(i=>by(i.createdBy) && i.status==='approved' && inRange(i.decidedAt||i.createdAt,f,t));
  const allInv = S.data.invoices.filter(i=>by(i.createdBy) && inRange(i.createdAt,f,t));
  return {inv, n:inv.length, pcs:inv.reduce((a,i)=>a+pieces(i),0), total:inv.reduce((a,i)=>a+(i.total||0),0),
    rejected:allInv.filter(i=>i.status==='rejected').length, pending:allInv.filter(i=>i.status==='posted').length,
    approvedByHim:S.data.invoices.filter(i=>by(i.decidedBy) && i.status==='approved' && !by(i.createdBy) && inRange(i.decidedAt,f,t)).length,
    sup:S.data.supplies.filter(s=>by(s.createdBy) && inRange(s.createdAt,f,t)).length,
    tr:S.data.transfers.filter(x=>by(x.createdBy) && inRange(x.createdAt,f,t)).length,
    req:S.data.requests.filter(r=>by(r.createdBy) && inRange(r.createdAt,f,t)).length};
}

const DST = {pending:['بانتظار المدير','t-warn'], approved:['تمت الموافقة','t-ok'], rejected:['مرفوض','t-bad']};
const itemCode = id => ((S.data.itemsAll||S.data.items).find(i=>i.id===id)||{}).code || '';
const itemNm = id => ((S.data.itemsAll||S.data.items).find(i=>i.id===id)||{}).name || '';
const dt = s => s ? new Date(s).toLocaleString('ar-SA-u-nu-latn-ca-gregory',{dateStyle:'medium',timeStyle:'short'}) : '—';
/* one description used both on screen and in the PDF */
function detailOf(kind, id){
  if(kind==='sup'){ const s = byId(S.data.supplies,id); if(!s) return null; const loc = s.source==='local', showP = loc && has('supply_prices');
    const meta = [['المخزن المستلم', whName(s.whId)], ['المصدر', loc?'شراء محلي من محل':'بضاعة مستوردة']];
    if(loc) meta.push(['اسم المحل أو المورّد', s.shop||'—'], ['مكان المحل', s.place||'—'], ['رقم فاتورة الشراء', s.purchaseNo||'—'], ['تاريخ فاتورة الشراء', s.purchaseDate||'—']); else meta.push(['رقم الشحنة أو المرجع', s.ref||'—']);
    const cols = ['#','الصنف','رقم القطعة','الكمية'].concat(showP?['سعر الشراء','المجموع']:[]);
    const rows = (s.lines||[]).map((l,n)=>[n+1, l.name, l.code||itemCode(l.itemId), num(l.qty)].concat(showP?[num(l.price), num((l.qty||0)*(l.price||0))]:[]));
    const total = showP ? (s.lines||[]).reduce((a,l)=>a+(l.qty||0)*(l.price||0),0) : null;
    return {title:'توريد بضاعة', no:s.no, status:s.status||'approved', meta, cols, rows, sumLabel:'عدد القطع', sum:num(pieces(s)), total, note:s.note, by:s.createdBy, at:s.createdAt, decidedBy:s.decidedBy, decidedAt:s.decidedAt, reason:s.reason, file:s.attachmentId, kind, id};
  }
  if(kind==='tr'){ const t = byId(S.data.transfers,id); if(!t) return null;
    return {title:'نقل بين المخازن', no:t.no, status:t.status, meta:[['من مخزن', whName(t.fromWh)], ['إلى مخزن', whName(t.toWh)]], cols:['#','الصنف','رقم القطعة','الكمية'],
      rows:(t.lines||[]).map((l,n)=>[n+1, l.name, itemCode(l.itemId), num(l.qty)]), sumLabel:'عدد القطع', sum:num(pieces(t)), note:t.note, by:t.createdBy, at:t.createdAt, decidedBy:t.decidedBy, decidedAt:t.decidedAt, reason:t.reason, kind, id};
  }
  const r = byId(S.data.requests,id); if(!r) return null; const p = r.payload||{};
  const base = {title:'طلب '+(RQ[r.type]||''), no:'', status:r.status, meta:[['نوع الطلب', RQ[r.type]||r.type], ['المخزن', whName(r.whId)]], cols:null, rows:[], note:'', by:r.createdBy, at:r.createdAt, decidedBy:r.decidedBy, decidedAt:r.decidedAt, reason:r.reason, kind:'req', id, text:r.text};
  const L = {name:'اسم الصنف', code:'رقم القطعة', category:'التصنيف', brand:'الماركة والموديلات', minQty:'حد التنبيه'};
  if(r.type==='item_create'){ const a = p.data||{}; base.meta = base.meta.concat(Object.keys(L).map(k=>[L[k], a[k]===''||a[k]==null?'—':String(a[k])])); }
  else if(r.type==='item_update'){ const b = p.before||{}, a = p.data||{}; base.meta.push(['الصنف', (b.name||itemNm(p.itemId))+' · '+(b.code||itemCode(p.itemId))]);
    base.cols = ['البيان','قبل التعديل','بعد التعديل','']; base.rows = Object.keys(L).map(k=>{ const ch = String(b[k]??'')!==String(a[k]??''); return [L[k], b[k]??'—', a[k]??'—', ch?'تغيّر':'']; }); }
  else if(r.type==='item_delete'){ base.meta.push(['الصنف', itemNm(p.itemId)], ['رقم القطعة', itemCode(p.itemId)], ['سبب الحذف', p.why||'—']); }
  else if(r.type==='stock_adjust'){ const s = stockOf(p.itemId, p.whId); base.meta.push(['الصنف', itemNm(p.itemId)+' · '+itemCode(p.itemId)], ['العملية', p.mode==='add'?'إضافة كمية':'تعيين الكمية بعد الجرد'], ['الكمية المطلوبة', num(p.qty)], ['الكمية الحالية في المخزن', num(s.qty||0)], ['السبب', p.why||'—']); if(r.result) base.meta.push(['النتيجة', r.result]); }
  else if(r.type==='import'){ base.cols = ['#','الصنف','رقم القطعة','التصنيف','المخزن','الكمية','الحالة']; base.rows = (p.rows||[]).map((x,n)=>[n+1, x.name, x.code, x.category||'—', x.whId?whName(x.whId):'—', num(x.qty||0), x.exists?'تحديث':'جديد']); base.sumLabel = 'عدد الأسطر'; base.sum = num((p.rows||[]).length); }
  else if(r.type==='invoice_cancel'){ const i = byId(S.data.invoices,p.invoiceId)||{}; base.meta.push(['رقم الفاتورة', i.no||'—'], ['العميل', (i.customerName||'—')+(i.customerPhone?' · '+i.customerPhone:'')], ['إجمالي الفاتورة', num(i.total)], ['سبب الإلغاء', p.why||'—']);
    base.cols = ['#','الصنف','رقم القطعة','الكمية','السعر','المجموع']; base.rows = (i.lines||[]).map((l,n)=>[n+1, l.name, l.code, num(l.qty), num(l.price), num(l.qty*l.price)]); }
  return base;
}

      <div style="text-align:left"><div style="font-size:21px;font-weight:800">${esc(o.title)}</div>${o.no?`<div style="${PM}">${esc(o.no)}</div>`:''}<div style="${PM};font-size:12px">تاريخ الطباعة: ${esc(dt(new Date().toISOString()))}</div></div>

async function pdfPages(htmls, filename, btn){
  if(!window.html2canvas || !window.jspdf){ toast('مكتبة PDF لم تُحمّل، أعد تحميل الصفحة'); return; }
  if(!S.dl){ toast('التنزيل غير متاح في هذا العرض'); return; }
  const label = btn ? btn.textContent : ''; if(btn){ btn.disabled = true; btn.textContent = 'جاري التجهيز…'; }
  const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-10000px;top:0;z-index:-1'; document.body.appendChild(host);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const pdf = new window.jspdf.jsPDF({unit:'pt', format:'a4'}), W = 595.28, H = 841.89;
    for(let n=0;n<htmls.length;n++){
      host.innerHTML = htmls[n];
      const canvas = await html2canvas(host.firstElementChild, {scale:2, backgroundColor:'#ffffff', useCORS:true});
      const h = canvas.height * W / canvas.width, img = canvas.toDataURL('image/jpeg', 0.9);
      if(n) pdf.addPage();
      let y = 0; pdf.addImage(img, 'JPEG', 0, 0, W, h); while(h - y > H + 1){ y += H; pdf.addPage(); pdf.addImage(img, 'JPEG', 0, -y, W, h); }
    }
    await S.dl.save({filename, data:pdf.output('blob')}); toast('تم تنزيل الملف');
  }catch(e){ if(!(e && e.code==='declined')) toast('تعذّر إنشاء PDF'); }
  finally{ host.remove(); if(btn){ btn.disabled = false; btn.textContent = label; } }
}
/* split table rows into pages; the first page also carries the info block */
function paginate(o, head, cols, rows, tail){
  const per1 = head ? 16 : 22, per = 24, chunks = [];
  if(!rows.length) chunks.push([]); else { chunks.push(rows.slice(0, per1)); for(let i=per1;i<rows.length;i+=per) chunks.push(rows.slice(i, i+per)); }
  const fs = cols && cols.length>7 ? 11.5 : 13, pad = cols && cols.length>7 ? '7px 6px' : '8px 9px';
  const th = `text-align:right;padding:${pad};border-bottom:1px solid #D9D5C9;background:#F7F3E3;font-size:${fs}px;white-space:normal;color:#1C1B18`, td = `padding:${pad};border-bottom:1px solid #EEE;font-size:${fs}px;vertical-align:top;white-space:pre-line;overflow-wrap:break-word;color:#1C1B18`;
  return chunks.map((c,n)=>{ const last = n===chunks.length-1;
    const table = cols && c.length ? `<table style="width:100%;border-collapse:collapse"><thead><tr>${cols.map(h=>`<th style="${th}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.map(r=>`<tr>${r.map(x=>`<td style="${td}${/^\S{1,12}$/.test(String(x))?';white-space:nowrap':''}">${esc(String(x))}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '';
    return pdfPage(o, (n===0?head:'')+table+(last?tail:''), n+1, chunks.length, last); });
}

async function saveAdj(){

function matchWh(name){ name = String(name||'').trim(); if(!name) return null; return S.data.warehouses.find(w=>whName(w.id)===name || w.name===name) || undefined; }
/* accepts the shop's own column names as well as the template's */
const XL_COLS = {name:['الاسم','اسم الصنف','الصنف','اسم القطعة','name'], code:['الكود','رقم الصنف','رقم القطعة','كود الصنف','code'], category:['التصنيف','اسم المجموعة','المجموعة','category'],
  groupNo:['رقم المجموعة'], brand:['الماركة والموديلات','الماركة','الموديلات','brand'], note:['ملاحظات','ملاحظة','notes'], minQty:['حد التنبيه','الحد الأدنى'], wh:['المخزن','warehouse'], qty:['الكمية','الكميه','qty']};
function xlGet(r, k){ for(const h of XL_COLS[k]){ if(r[h]!==undefined && r[h]!=='') return r[h]; } return ''; }
function readXl(file){
  if(!window.XLSX){ showErr('مكتبة Excel لم تُحمّل، أعد تحميل الصفحة.'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const wb = XLSX.read(new Uint8Array(fr.result), {type:'array'});
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:'', raw:false}).map(r=>{ const o = {}; Object.keys(r).forEach(k=>{ o[String(k).trim()] = typeof r[k]==='string' ? r[k].trim() : r[k]; }); return o; });
      if(raw.length && !Object.keys(raw[0]).some(k=>XL_COLS.name.includes(k)) ) return showErr('لم أجد عمود اسم الصنف. يلزم عمود باسم «اسم الصنف» أو «الاسم».', 'x-file');
      if(raw.length && !Object.keys(raw[0]).some(k=>XL_COLS.code.includes(k)) ) return showErr('لم أجد عمود رقم الصنف. يلزم عمود باسم «رقم الصنف» أو «الكود».', 'x-file');
      M.raw = raw; buildImport();
    }catch(e){ showErr('تعذّر قراءة الملف. تأكد أنه ملف Excel.', 'x-file'); }
  };
  fr.readAsArrayBuffer(file);
}
function buildImport(){
  if(!M || !M.raw) return; const defWh = val('x-wh');
  const seen = new Map(), all = S.data.itemsAll||S.data.items, byCode = new Map(all.map(i=>[lc(i.code), i]));
  const rows = M.raw.map((r,ix)=>{ const q = String(xlGet(r,'qty')).replace(/,/g,'');
    const o = {line:ix+2, name:String(xlGet(r,'name')).trim(), code:String(xlGet(r,'code')).trim(), category:String(xlGet(r,'category')).trim(), groupNo:String(xlGet(r,'groupNo')).trim(), brand:String(xlGet(r,'brand')).trim(), note:String(xlGet(r,'note')).trim(), minQty:parseInt(xlGet(r,'minQty'))||0, whRaw:String(xlGet(r,'wh')).trim(), qty:q===''?0:Number(q)};
    const errs = []; if(!o.name) errs.push('اسم الصنف فارغ'); if(!o.code) errs.push('رقم الصنف فارغ');
    if(isNaN(o.qty) || o.qty<0 || !Number.isInteger(o.qty)) errs.push('الكمية غير صحيحة');
    if(o.whRaw){ const w = matchWh(o.whRaw); if(!w) errs.push('المخزن «'+o.whRaw+'» غير موجود'); else if(!scopeOk('stock_adjust',w.id) && !isOwner()) errs.push('لا صلاحية على المخزن'); else o.whId = w.id; }
    else if(o.qty>0){ if(defWh) o.whId = defWh; else errs.push('فيه كمية: اختر المخزن من الأعلى'); }
    if(o.code){ const k = lc(o.code); if(seen.has(k)) errs.push('رقم الصنف مكرر مع السطر '+seen.get(k)); else seen.set(k, o.line); }
    o.exists = !!byCode.get(lc(o.code));
    o.errs = errs; return o; }).filter(o=>o.name||o.code);
  M.rows = rows;
  const ok = rows.filter(r=>!r.errs.length), bad = rows.length-ok.length, nw = ok.filter(r=>!r.exists).length, withQ = ok.filter(r=>r.qty>0).length;
  const show = rows.slice().sort((a,b)=>b.errs.length-a.errs.length).slice(0,150);
  document.getElementById('x-prev').innerHTML = `<div class="kpis" style="margin-bottom:10px"><div class="card kpi"><p>في الملف</p><b>${num(rows.length)}</b></div><div class="card kpi"><p>صنف جديد</p><b>${num(nw)}</b></div><div class="card kpi"><p>تحديث صنف موجود</p><b>${num(ok.length-nw)}</b></div><div class="card kpi"><p>فيه خطأ ولن يُستورد</p><b style="color:${bad?'var(--bad)':'inherit'}">${num(bad)}</b></div></div>
  ${withQ?`<p class="note">${num(withQ)} صنف معه كمية تُضاف للمخزون.</p>`:'<p class="note">لا توجد كميات في الملف. تُستورد الأصناف فقط، وتُدخل الكميات لاحقاً من التوريد.</p>'}
  <div class="tw" style="max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px"><table><thead><tr><th>السطر</th><th>الحالة</th><th>رقم الصنف</th><th>اسم الصنف</th><th>المجموعة</th><th>المخزن</th><th>الكمية</th></tr></thead><tbody>${show.map(r=>`<tr><td>${r.line}</td><td>${r.errs.length?`<span class="tag t-bad">${esc(r.errs.join('، '))}</span>`:(r.exists?'<span class="tag t-warn">تحديث</span>':'<span class="tag t-ok">جديد</span>')}</td><td>${esc(r.code)}</td><td style="white-space:normal">${esc(r.name)}</td><td>${esc(r.category||'—')}</td><td>${r.whId?esc(whName(r.whId)):'—'}</td><td>${num(r.qty)}</td></tr>`).join('')}</tbody></table></div>
  ${rows.length>show.length?`<p class="note">يظهر أول ${num(show.length)} سطر${bad?' (الأخطاء أولاً)':''}.</p>`:''}`;
  const go = document.getElementById('x-go'); go.disabled = !ok.length; go.textContent = ok.length ? (isOwner()?'استيراد '+num(ok.length)+' صنف':'إرسال '+num(ok.length)+' صنف للمدير') : 'استيراد';
  const e = $modal.querySelector('.err'); if(e) e.hidden = true;
}
async function doImport(){
  const rows = M.rows.filter(r=>!r.errs.length); const btn = document.getElementById('x-go'); btn.disabled = true; btn.textContent = 'جاري الإرسال…';
  if(!isOwner()){ try{ await createRequest('import', {rows:rows.map(r=>pick(r,['name','code','category','groupNo','brand','note','minQty','whId','qty','exists']))}, `طلب استيراد ${rows.length} صنف من Excel`); closeModal(); toast('أُرسل الاستيراد للمدير، ويُطبّق بعد موافقته'); }catch(e){ dbErr(e); btn.disabled = false; btn.textContent = 'استيراد'; } return; }
  const prev = document.getElementById('x-prev'); prev.innerHTML = `<p style="margin:0 0 8px;font-weight:700" id="x-pt">جاري الاستيراد… 0 من ${num(rows.length)}</p><div class="progress"><i id="x-pb"></i></div><p class="note" style="margin-top:8px">لا تغلق الصفحة حتى ينتهي.</p>`;
  try{ const c = await applyImport(rows, '', (d,n)=>{ const b = document.getElementById('x-pb'), t = document.getElementById('x-pt'); if(b) b.style.width = Math.round(d/n*100)+'%'; if(t) t.textContent = `جاري الاستيراد… ${num(d)} من ${num(n)}`; });
    closeModal(); toast(`تم الاستيراد: ${num(c.made)} جديد · ${num(c.upd)} تحديث${c.qtyRows?' · '+num(c.qtyRows)+' كمية':''}`); }
  catch(e){ dbErr(e); btn.disabled = false; btn.textContent = 'إعادة المحاولة'; }
}
/* writes in groups of up to 400 so a big sheet is fast and does not redraw the page thousands of times */
async function applyImport(rows, note, onProg){
  let made = 0, upd = 0, qtyRows = 0, done = 0; const all = S.data.itemsAll||S.data.items, byCode = new Map(all.map(i=>[lc(i.code), i]));
  const now = new Date().toISOString(), addQ = {};
  S.bulk = true;
  try{
    for(let i=0;i<rows.length;i+=400){
      const part = rows.slice(i, i+400), B = S.db.batch ? S.db.batch() : null, jobs = [];
      for(const r of part){
        const it = byCode.get(lc(r.code));
        const d = {name:r.name, code:r.code, category:r.category||'', brand:r.brand||'', minQty:r.minQty||0}; if(r.groupNo) d.groupNo = r.groupNo; if(r.note) d.note = r.note;
        let id;
        if(it){ if(it.deleted) d.deleted = false; id = it.id; if(B) B.update('items/'+id, d); else jobs.push(S.db.doc('items/'+id).update(d)); upd++; }
        else { d.createdAt = now; d.createdBy = S.me; const ref = S.db.collection('items').doc(); id = ref.id; if(B) B.set('items/'+id, d); else jobs.push(ref.set(d)); made++; byCode.set(lc(r.code), Object.assign({id}, d)); }
        if(r.whId && r.qty>0){ const k = id+'__'+r.whId; addQ[k] = (addQ[k]||{itemId:id, whId:r.whId, q:0}); addQ[k].q += r.qty; qtyRows++; }
      }
      if(B) await B.commit(); else await Promise.all(jobs);
      done += part.length; if(onProg) onProg(done, rows.length);
    }
    const Q = Object.values(addQ);
    for(let i=0;i<Q.length;i+=400){ const part = Q.slice(i,i+400), B = S.db.batch ? S.db.batch() : null, jobs = [];
      for(const x of part){ const cur = stockOf(x.itemId, x.whId), d = {itemId:x.itemId, whId:x.whId, qty:(cur.qty||0)+x.q, frozen:cur.frozen||0}; if(B) B.set('stock/'+x.itemId+'__'+x.whId, d); else jobs.push(S.db.doc('stock/'+x.itemId+'__'+x.whId).set(d)); }
      if(B) await B.commit(); else await Promise.all(jobs); }
  } finally { S.bulk = false; setTimeout(render, 50); }
  logAct('import', `استيراد Excel: ${made} صنف جديد، ${upd} تحديث، ${qtyRows} إدخال كمية${note?' · '+note:''}`);
  return {made, upd, qtyRows};
}

/* ---------- small helpers every page gets: password eye, clear-search button, table labels for phones ---------- */
function liveCheck(t){
  const host = t.closest('td') || t.parentElement; let h = host.querySelector('.fhint');
  const v = t.value, n = Number(v), max = t.dataset.max!=null ? Number(t.dataset.max) : null, needInt = t.step==='' || t.step==='1' || t.hasAttribute('data-int');
  let msg = '';
  if(v==='') msg = ''; else if(isNaN(n)) msg = 'اكتب رقماً فقط';
  else if(n<0) msg = 'لا يقبل رقماً بالسالب';
  else if(needInt && !Number.isInteger(n) && (t.dataset.lq!=null||t.dataset.tq!=null||t.dataset.sq!=null||t.id==='m-qty')) msg = 'الكمية رقم صحيح بدون كسور';
  else if((t.dataset.lq!=null||t.dataset.tq!=null||t.dataset.sq!=null) && n<1) msg = 'الكمية 1 على الأقل';
  else if(max!=null && n>max) msg = 'أكبر من المتاح. المتاح '+num(max)+' فقط';
  if(!msg){ if(h) h.remove(); t.classList.remove('bad-f'); return; }
  if(!h){ h = document.createElement('p'); h.className = 'fhint'; h.setAttribute('aria-live','polite'); t.insertAdjacentElement('afterend', h); }
  h.textContent = msg; t.classList.add('bad-f');
}
function enhance(root){
  root.querySelectorAll('input[type=password]:not([data-enh]),input[type=search]:not([data-enh])').forEach(i=>{
    i.dataset.enh = '1'; const w = document.createElement('span'); w.className = 'fx'; i.parentNode.insertBefore(w, i); w.appendChild(i);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'fxb';
    if(i.type==='password'){ b.dataset.act = 'pweye'; b.innerHTML = ICON.eye; b.setAttribute('aria-label','إظهار كلمة المرور'); b.setAttribute('aria-pressed','false'); }
    else { b.dataset.act = 'sclear'; b.innerHTML = ICON.x; b.setAttribute('aria-label','مسح البحث'); b.hidden = !i.value; }
    w.appendChild(b);
  });
  root.querySelectorAll('.tw table:not([data-enh])').forEach(tb=>{
    tb.dataset.enh = '1'; if(tb.closest('#x-prev')) return; tb.classList.add('cards');
    const hs = Array.from(tb.querySelectorAll('thead th')).map(th=>th.querySelector('input')?'':th.textContent.trim());
    tb.querySelectorAll('tbody tr').forEach(tr=>Array.from(tr.children).forEach((td,i)=>td.setAttribute('data-label', hs[i]||'')));
  });
}
new MutationObserver(()=>{ enhance(document); }).observe(document.body, {childList:true, subtree:true});

    selall:()=>{ const boxes = Array.from(document.querySelectorAll('[data-sel]')); const allOn = boxes.length && boxes.every(b=>S.inv.sel.has(b.dataset.sel)); boxes.forEach(b=>{ if(allOn) S.inv.sel.delete(b.dataset.sel); else S.inv.sel.add(b.dataset.sel); }); render(); },
    postsel:postSel, approvesel:approveSel, rejectsel:()=>reasonModal('reject', Array.from(S.inv.sel)), doreason:doReason,
    viewinv:()=>viewInvoice(t.dataset.id), pdf:()=>downloadPdf(t), cancelapp:()=>reasonModal('cancelapp',[M.id]),
    editinv:()=>{ const i = byId(S.data.invoices,t.dataset.id); if(!i) return; startForm(i); S.keepForm = true; if(location.hash!=='#newinv') location.hash = '#newinv'; else render(); },
    canceldraft:()=>cancelDraft(t.dataset.id), docanceldraft:doCancelDraft,
    pick:()=>doPick(t.dataset.ctx, t.dataset.id),
    rmline:()=>{ readForm(); S.form.lines.splice(+t.dataset.i,1); render(); },
    cancelform:()=>{ S.form = null; location.hash = '#invoices'; },
    saveinv:()=>saveInvoice(t.dataset.mode, t),
    notes:notesModal,
    supsrc:()=>{ readSup(); S.sup.source = t.dataset.v; render(); },
    suprm:()=>{ readSup(); S.sup.lines.splice(+t.dataset.i,1); render(); },
    supreset:()=>{ S.sup = null; render(); }, supsave:()=>saveSupply(t),
    trrm:()=>{ readTr(); S.tr.lines.splice(+t.dataset.i,1); render(); }, trsave:()=>saveTransfer(t),
    trtab:()=>{ S.trTab = t.dataset.tab; render(); }, trapprove:()=>approveTr(t.dataset.id), trreject:()=>reasonModal('rejecttr',[t.dataset.id]),
    reptab:()=>{ S.rep.tab = t.dataset.tab; render(); }, repexport:repExport,
    navtoggle:()=>{ S.navOpen = !S.navOpen; S.bell = false; render(); if(S.navOpen){ const f = document.querySelector('.side a'); if(f) f.focus(); } },
    navclose:()=>{ S.navOpen = false; render(); },
    bell:()=>{ S.bell = !S.bell; S.navOpen = false; render(); const b = document.querySelector(S.bell?'.npanel .link':'[data-act=bell]'); if(b) b.focus(); },
    pweye:()=>{ const i = t.parentElement.querySelector('input'); const show = i.type==='password'; i.type = show?'text':'password'; t.innerHTML = show?ICON.eyeOff:ICON.eye; t.setAttribute('aria-label', show?'إخفاء كلمة المرور':'إظهار كلمة المرور'); t.setAttribute('aria-pressed', show); i.focus(); },
    sclear:()=>{ const i = t.parentElement.querySelector('input'); i.value = ''; i.dispatchEvent(new Event('input', {bubbles:true})); const n = document.getElementById(i.id); if(n) n.focus(); },
    more:()=>{ S.lim[t.dataset.k] += 200; render(); },
    clearf:()=>{ const k = t.dataset.scope; if(k==='stock') S.f = {wh:'', q:'', cat:'', all:false}; else if(k==='rep') Object.assign(S.rep, {wh:'', from:'', to:'', item:''}); else if(k==='repu') Object.assign(S.rep, {user:'', uq:'', ptype:'month', pref:new Date().toISOString().slice(0,10)}); render(); toast('تم مسح الفلاتر'); },

    togglebranch:()=>{ const w = wh(t.dataset.id); if(w && confirm(w.frozen?'إلغاء تجميد '+w.name+'؟ ترجع حسابات موظفيه للعمل.':'تجميد '+w.name+'؟ يخرج كل موظفيه من النظام ولا يقدرون يدخلون.')) toggleBranch(t.dataset.id); }
  };
  if(map[a]){ e.preventDefault(); map[a](); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.classList && t.classList.contains('bad-f')){ t.classList.remove('bad-f'); t.removeAttribute('aria-invalid'); const n = (t.closest('.fx')||t).nextElementSibling; if(n && n.classList.contains('ferr')) n.remove(); }
  if(t.closest && t.closest('.fx')){ const x = t.closest('.fx').querySelector('[data-act=sclear]'); if(x) x.hidden = !t.value; }
  if(t.type==='number') liveCheck(t);
  if(t.dataset.f==='q'){ S.f.q = t.value; S.lim.stock = 100; const pos = t.selectionStart; render(); const n = document.getElementById('f-q'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
  if(t.dataset.lq!=null || t.dataset.lp!=null){ updTotals(); return; }
  if(t.dataset.sq!=null || t.dataset.sp!=null){ readSup(); S.sup.lines.forEach((l,i)=>{ const c = document.getElementById('st-'+i); if(c) c.textContent = num((+l.qty||0)*(+l.price||0)); }); return; }
  if(t.dataset.pick){ renderPick(t.dataset.pick, t.value); return; }
  if(t.dataset.search){ const k = t.dataset.search, v = t.value;
    if(k==='rq') S.rq.q = v; else if(k==='rep') S.rep.uq = v; else if(k==='users') S.uq = v; else if(k==='log') S.lq = v; else if(k==='inv'){ S.inv.q = v; S.inv.sel.clear(); }
    const id = t.id, pos = t.selectionStart; render(); const n = document.getElementById(id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } return; }
  if(t.dataset.iq){ S.iq = t.value; S.lim.items = 100; const pos = t.selectionStart; render(); const n = document.getElementById('i-q'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.f && t.dataset.f!=='q'){ S.f[t.dataset.f] = t.type==='checkbox' ? t.checked : t.value; S.lim.stock = 100; render(); }
  if(t.id==='m-item' || t.id==='m-wh') updCur();
  if(t.dataset.sel){ if(t.checked) S.inv.sel.add(t.dataset.sel); else S.inv.sel.delete(t.dataset.sel); render(); }
  if(t.id==='inv-wh'){ readForm(); render(); }
  if(t.id==='t-from'){ readTr(); S.tr.to = ''; render(); }
  if(t.dataset.r){ S.rep[t.dataset.r] = t.value; render(); }
  if(t.id==='s-file' && S.sup){ S.sup.file = t.files[0] || null; const n = document.getElementById('s-fname'); if(n) n.textContent = S.sup.file ? 'المرفق: '+S.sup.file.name : 'لم يُرفق ملف بعد'; }
  if(t.id==='u-city') fillUserWh('');

  if(t.dataset.perm){ const sc = $modal.querySelector(`[data-scope="${t.dataset.perm}"]`); if(sc) sc.disabled = !t.checked; }
  if(t.id==='x-file' && t.files[0]) readXl(t.files[0]);
  if(t.id==='x-wh') buildImport();
});
document.addEventListener('keydown', e => { if(e.key==='Escape'){ if($modal.innerHTML) closeModal(); else if(S.bell || S.navOpen){ S.bell = false; S.navOpen = false; render(); } }
  if(e.key==='Enter' && e.target.tagName==='INPUT' && !e.target.dataset.pick && $modal.contains(e.target) && !/checkbox|file/.test(e.target.type)){ const b = $modal.querySelector('.dlg > .row:last-child .btn:not(.sec):not([disabled])'); if(b){ e.preventDefault(); b.click(); } }
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.pick){ e.preventDefault(); const f = document.querySelector('#pkr-'+e.target.dataset.pick+' .pick-item'); if(f) f.click(); } });

boot();
